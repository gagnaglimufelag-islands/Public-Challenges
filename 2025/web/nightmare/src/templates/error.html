<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uh Oh | NeuroMax AI™</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            blob: "blob 7s infinite",
          },
          keyframes: {
            blob: {
              "0%, 100%": { transform: "translate(0px, 0px) scale(1)" },
              "33%": { transform: "translate(30px, -20px) scale(1.1)" },
              "66%": { transform: "translate(-20px, 20px) scale(0.9)" }
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center px-4 text-white font-sans">

  <!-- Animated Blobs -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob"></div>
    <div class="absolute top-40 right-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-10 left-1/3 w-72 h-72 bg-yellow-500 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-4000"></div>
  </div>

  <!-- Error Card -->
  <div class="relative z-10 backdrop-blur-md bg-white/10 rounded-3xl p-10 max-w-md w-full shadow-2xl border border-white/10 text-center transition-transform hover:scale-[1.01] duration-300">
    <div class="mb-6">
      <svg class="mx-auto w-20 h-20 text-red-400 animate-bounce" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1 class="text-4xl font-extrabold mb-4 text-red-400">😬 Whoops</h1>
    <p class="text-lg text-gray-300 mb-6">Looks like our AI transcended space-time again and broke something.</p>
    <a href="/" class="inline-block bg-gray-700 hover:bg-gray-600 transition px-6 py-3 rounded-full text-white font-semibold shadow-md">Go Back to The Truth</a>
    <p class="text-xs text-gray-500 mt-4">This is totally normal. Trust the AI.</p>
  </div>

</body>
</html>
